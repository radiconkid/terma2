name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: terma
            asset_name: terma-x86_64-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: terma.exe
            asset_name: terma-x86_64-windows.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: terma
            asset_name: terma-x86_64-macos
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --release --target ${{ matrix.target }} --verbose
    - name: Rename binary for upload
      run: mv target/${{ matrix.target }}/release/${{ matrix.artifact_name }} target/${{ matrix.target }}/release/${{ matrix.asset_name }}
    - name: Upload release asset
      uses: softprops/action-gh-release@v2
      with:
        files: target/${{ matrix.target }}/release/${{ matrix.asset_name }}

